name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: C++ ${{ matrix.compiler }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        compiler: [g++]
    steps:
      - uses: actions/checkout@v4

      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ libcurl4-openssl-dev libssl-dev protobuf-compiler libprotobuf-dev

      # Use distro protobuf on Linux CI. Bundled protobuf+abseil with `cmake --build -j`
      # OOMs the GitHub runner (processes get SIGTERM / exit 143).
      - name: Configure
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DPICKPOINT_BUILD_TESTS=ON \
            -DPICKPOINT_BUNDLED_PROTOBUF=OFF \
            -DCMAKE_CXX_COMPILER=${{ matrix.compiler }}

      - name: Build
        run: cmake --build build -j 2

      - name: Test
        run: ctest --test-dir build --output-on-failure -E '^E2E\.'
